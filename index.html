
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polishändelser i Jämtland – JT</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #222;
  background: #fff;
}
.feed { padding: 12px; }
h2 {
  font-size: 21px;
  margin: 0 0 5px;
}
.subtitle {
  color: #666;
  font-size: 12px;
  margin-bottom: 12px;
}
.event {
  padding: 13px 0;
  border-bottom: 1px solid #ddd;
}
.date {
  font-size: 12px;
  color: #666;
  margin-bottom: 5px;
}
.event a {
  color: #222;
  font-size: 16px;
  font-weight: bold;
  text-decoration: none;
}
.event a:hover { text-decoration: underline; }
.event p {
  font-size: 13px;
  line-height: 1.5;
  margin: 6px 0 0;
}
.footer {
  font-size: 12px;
  color: #666;
  padding-top: 12px;
}
.footer a { color: inherit; }
</style>
</head>
<body>
<div class="feed">
  <h2>Senaste från polisen</h2>
  <div class="subtitle">Polishändelser i Jämtlands län</div>
  <div id="events" aria-live="polite">Hämtar händelser...</div>
  <div class="footer">
    Källa: Polismyndigheten.
    Uppgifterna är preliminära.
  </div>
</div>

<script>
const endpoint =
  "https://polisen.se/api/events?locationname=" +
  encodeURIComponent("Jämtlands län");

function textElement(tag, content, className) {
  const el = document.createElement(tag);
  el.textContent = content;
  if (className) el.className = className;
  return el;
}

async function loadEvents() {
  const container = document.getElementById("events");
  try {
    const response = await fetch(endpoint, { cache: "no-store" });
    if (!response.ok) throw new Error("API-fel");
    const data = await response.json();

    const events = data
      .filter(e => (e.location?.name || "")
        .toLowerCase().includes("jämtland"))
      .sort((a, b) => new Date(b.datetime) - new Date(a.datetime))
      .slice(0, 6);

    container.replaceChildren();

    if (!events.length) {
      container.textContent = "Inga aktuella händelser att visa.";
      return;
    }

    for (const event of events) {
      const item = document.createElement("div");
      item.className = "event";

      const date = new Date(event.datetime);
      const dateText = Number.isNaN(date.getTime())
        ? event.datetime
        : date.toLocaleString("sv-SE", {
            day: "numeric", month: "short",
            hour: "2-digit", minute: "2-digit",
            timeZone: "Europe/Stockholm"
          });

      item.appendChild(textElement("div", dateText, "date"));

      const link = document.createElement("a");
      link.textContent = event.name || event.type || "Polishändelse";
      const url = new URL(event.url, "https://polisen.se");
      if (url.hostname === "polisen.se" ||
          url.hostname.endsWith(".polisen.se")) {
        link.href = url.href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
      }
      item.appendChild(link);

      if (event.summary) {
        item.appendChild(textElement("p", event.summary));
      }
      container.appendChild(item);
    }
  } catch (error) {
    if (!container.querySelector(".event")) {
      container.textContent =
        "Polisens händelser kan inte hämtas just nu.";
    }
  }
}

loadEvents();
setInterval(loadEvents, 300000);
</script>
</body>
</html>
