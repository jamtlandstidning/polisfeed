
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blåljus i Jämtland – Jämtlands Tidning</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff;
  color: #222;
}

.feed { padding: 12px; }

h2 {
  font-size: 22px;
  margin: 0 0 6px;
}

.subtitle {
  color: #666;
  font-size: 12px;
  margin-bottom: 12px;
}

.event {
  padding: 13px 0;
  border-bottom: 1px solid #ddd;
}

.date {
  font-size: 12px;
  color: #666;
  margin-bottom: 5px;
}

.event a {
  color: #222;
  font-size: 16px;
  font-weight: bold;
  text-decoration: none;
}

.event a:hover { text-decoration: underline; }

.event p {
  font-size: 13px;
  line-height: 1.5;
  margin: 6px 0 0;
}

.more {
  display: block;
  padding: 16px 0;
  font-size: 15px;
  font-weight: bold;
  color: #222;
  text-decoration: none;
}

.more:hover { text-decoration: underline; }

.footer {
  font-size: 12px;
  color: #777;
  padding-top: 10px;
}
</style>
</head>

<body>
<div class="feed">
  <h2>Blåljus i Jämtland</h2>
  <div class="subtitle">
    Senaste händelserna från Polisen
  </div>

  <div id="events">Hämtar polishändelser...</div>

  <a id="more" class="more" href="?alla=1"
     target="_blank" rel="noopener">
    Visa fler polishändelser →
  </a>

  <div class="footer">
    Källa: Polismyndigheten.
    Uppgifterna är preliminära.
  </div>
</div>

<script>
const showAll =
  new URLSearchParams(window.location.search).has("alla");

const endpoint =
  "https://polisen.se/api/events?locationname=" +
  encodeURIComponent("Jämtlands län");

if (showAll) {
  document.getElementById("more").style.display = "none";
}

function addText(tag, value, className) {
  const element = document.createElement(tag);
  element.textContent = value;
  if (className) element.className = className;
  return element;
}

async function loadEvents() {
  const container = document.getElementById("events");

  try {
    const response = await fetch(endpoint, {
      cache: "no-store"
    });

    if (!response.ok) throw new Error("API-fel");

    const data = await response.json();

    const events = data
      .filter(event => {
        const locations = event.location || [];
        const names = Array.isArray(locations)
          ? locations.map(loc => loc.name || "")
          : [locations.name || ""];

        return names.some(name =>
          name.toLowerCase().includes("jämtland")
        );
      })
      .sort((a, b) =>
        new Date(b.datetime) - new Date(a.datetime)
      )
      .slice(0, showAll ? 30 : 6);

    container.replaceChildren();

    if (!events.length) {
      container.textContent =
        "Inga polishändelser att visa just nu.";
      return;
    }

    for (const event of events) {
      const item = document.createElement("div");
      item.className = "event";

      const date = new Date(event.datetime);
      const dateText = Number.isNaN(date.getTime())
        ? event.datetime
        : date.toLocaleString("sv-SE", {
            day: "numeric",
            month: "short",
            hour: "2-digit",
            minute: "2-digit",
            timeZone: "Europe/Stockholm"
          });

      item.appendChild(
        addText("div", dateText, "date")
      );

      const link = document.createElement("a");
      link.textContent =
        event.name || event.type || "Polishändelse";

      try {
        const url = new URL(
          event.url, "https://polisen.se"
        );

        if (url.hostname === "polisen.se" ||
            url.hostname.endsWith(".polisen.se")) {
          link.href = url.href;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
        }
      } catch (e) {}

      item.appendChild(link);

      if (event.summary) {
        item.appendChild(
          addText("p", event.summary)
        );
      }

      container.appendChild(item);
    }
  } catch (error) {
    if (!container.querySelector(".event")) {
      container.textContent =
        "Polisens händelser kan inte hämtas just nu.";
    }
  }
}

loadEvents();
setInterval(loadEvents, 300000);
</script>
</body>
</html>
